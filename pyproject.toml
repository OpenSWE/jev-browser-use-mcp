[project]
name = "jev-browser-use-mcp"
version = "0.1.0"
description = "A stdio MCP server that gives any coding agent Jev Ultrafast's browser agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # jev-ultrafast is not on PyPI; a sha is the only immutable handle (no tags exist).
    # https, never the ssh remote: an ssh URL makes this package uninstallable without a GitHub key.
    # browser-harness==0.1.13 arrives transitively. Never add the [mcp] extra.
    # OpenSWE fork = upstream 1231850 + browser-use/jev-ultrafast#10 (shadow DOM). Back to
    # upstream once #10 merges; see DECISIONS.md D20.
    "jev-ultrafast @ git+https://github.com/OpenSWE/jev-ultrafast@5f504932d37faed552653952ed6be7889ea2a317",
    "mcp>=2.1,<3",
]

[project.scripts]
jev-browser-use-mcp = "jev_browser_use_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# jev-ultrafast is a git URL (not on PyPI). This is also why this package cannot
# itself be published to PyPI: PyPI rejects any dist with a direct reference.
[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
